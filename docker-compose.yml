services:
  postgres:
    image: postgres:16
    container_name: hammr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hammr
      POSTGRES_PASSWORD: hammr123
      POSTGRES_DB: hammr
    ports:
      - "5432:5432"
    volumes:
      - hammr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hammr -d hammr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: hammr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hammr_redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hammr:hammr123@postgres:5432/hammr
      PORT: 5001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      NODE_ENV: production
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-5001}:5001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  hammr_postgres_data:
  hammr_redis_data:
